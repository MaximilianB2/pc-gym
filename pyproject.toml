[project]
name = "pcgym"
version = "0.1.8"
description = "Reinforcement learning suite of process control problems."
requires-python = ">=3.11"
license = { file = "LICENSE" }
readme = "README.md"
authors = [{ name = "Max Bloor", email = "max.bloor@gmail.com" }]
keywords = [
  "reinforcement-learning",
  "process-control",
  "jax",
  "casadi",
  "control",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Natural Language :: English",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dynamic = ["dependencies"]
[project.urls]
Documentation = "https://maximilianb2.github.io/pc-gym/"
Repository = "https://github.com/MaximilianB2/pc-gym"

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"


[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[project.optional-dependencies]
optional = ["jupyterlab", "torch", "stable-baselines3", "mkdocs-material"]
dev = [
  "ruff",
  "pytest",
  "pytest-cov",
  "pytest-xdist",
  "nbmake",
  "pyright",
  "pre-commit",
  "pip-audit",
  "build",
  "twine",
]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [
  "Control-Club-Challenge",
  "pc-gym_paper",
  "example_notebooks",
  "Quick_Start.ipynb",
  "docs",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# E741: scientific code uses single-letter math notation (e.g. SIRS model S/I/R).
extend-ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
# __init__.py legitimately re-exports the public API surface.
"src/pcgym/__init__.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "slow: integration/MPC/JAX tests excluded from default PR runs",
]
addopts = "-m 'not slow' --strict-markers"

[tool.coverage.run]
source = ["src/pcgym"]
branch = true

[tool.coverage.report]
fail_under = 45
show_missing = true
skip_covered = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
